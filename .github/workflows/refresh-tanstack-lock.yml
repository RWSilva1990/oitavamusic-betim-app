name: Refresh TanStack security lock

on:
  push:
    branches:
      - feature/scale-workflow-improvements-2026-10-16
    paths:
      - '.github/workflows/refresh-tanstack-lock.yml'

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/scale-workflow-improvements-2026-10-16
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Update patched TanStack Start and lockfile
        run: npm install @tanstack/react-start@1.168.60 --save-exact --package-lock-only --ignore-scripts

      - name: Verify patched server core
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json')
          const start = lock.packages['node_modules/@tanstack/react-start']?.version
          const server = lock.packages['node_modules/@tanstack/start-server-core']?.version
          console.log({ start, server })
          if (start !== '1.168.60') process.exit(1)
          const parts = String(server || '').split('.').map(Number)
          if (!server || parts[0] < 1 || (parts[0] === 1 && parts[1] < 169) || (parts[0] === 1 && parts[1] === 169 && parts[2] < 39)) process.exit(1)
          NODE

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: atualizar TanStack Start para versão corrigida"
          git push
