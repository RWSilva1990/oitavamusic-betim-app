name: Build Android Signed Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/android-production-shell-2026-08-27
    paths:
      - '.github/workflows/build-android-release-apk.yml'
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_SPA_BUILD: 'true'
      VITE_ANDROID_TEST_DIRECT_FIREBASE: 'false'
      VITE_FIREBASE_API_KEY: 'AIzaSyAQuplKbkau95AjkMhS4piewfzVYDULRQw'
      VITE_FIREBASE_APP_ID: '1:1082908267904:web:df0751076eca92bcb45d65'
      VITE_FIREBASE_MESSAGING_SENDER_ID: '1082908267904'
      VITE_FIREBASE_AUTH_DOMAIN: 'oitavamusicbetim.firebaseapp.com'
      VITE_FIREBASE_PROJECT_ID: 'oitavamusicbetim'
      VITE_FIREBASE_STORAGE_BUCKET: 'oitavamusicbetim.firebasestorage.app'
      VITE_ADMIN_EMAILS: 'rwsilvatec@gmail.com'
      VITE_APP_URL: 'https://oitavamusicbetim.vercel.app'
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/release-signing.jks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build Android SPA shell
        run: npm run build

      - name: Prepare packaged web assets
        shell: bash
        run: |
          set -euo pipefail
          SHELL_PATH="$(find .output dist -type f -name '_shell.html' 2>/dev/null | head -n 1 || true)"
          if [ -z "$SHELL_PATH" ]; then
            echo "TanStack SPA shell (_shell.html) was not found."
            exit 1
          fi
          STATIC_DIR="$(dirname "$SHELL_PATH")"
          rm -rf android-web
          mkdir -p android-web
          cp -R "$STATIC_DIR"/. android-web/
          mv android-web/_shell.html android-web/index.html
          test -s android-web/index.html

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: oitava-music-android-release-signed
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
