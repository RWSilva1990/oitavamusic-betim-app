name: Apply Lovable migration

on:
  push:
    branches:
      - lovable-migration
    paths:
      - '.github/workflows/apply-lovable-migration.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: lovable-migration
          fetch-depth: 0

      - name: Rebuild migration archive
        shell: bash
        run: |
          set -euo pipefail
          cat .migration/part*.b64 | base64 --decode > /tmp/lovable-migration.tar.xz
          mkdir -p /tmp/lovable-migration
          tar -xJf /tmp/lovable-migration.tar.xz -C /tmp/lovable-migration
          test -f /tmp/lovable-migration/divine-playlist-main/package.json

      - name: Replace branch source with Lovable version
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='public/icon-192.png' \
            --exclude='public/icon-512.png' \
            /tmp/lovable-migration/divine-playlist-main/ ./
          rm -rf .migration

      - name: Commit migrated application
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit -m 'Migrate Lovable app for Vercel preview'
          git push origin lovable-migration
