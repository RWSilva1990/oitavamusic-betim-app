name: Build Android Test APK

on:
  push:
    branches:
      - feature/pitch-testing-lab-2026-08-31
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_SPA_BUILD: 'true'
      VITE_ANDROID_TEST_DIRECT_FIREBASE: 'false'
      VITE_FIREBASE_API_KEY: ${{ secrets.TEST_FIREBASE_API_KEY }}
      VITE_FIREBASE_APP_ID: ${{ secrets.TEST_FIREBASE_APP_ID }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.TEST_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.TEST_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.TEST_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.TEST_FIREBASE_STORAGE_BUCKET }}
      VITE_ADMIN_EMAILS: ${{ secrets.TEST_ADMIN_EMAILS }}
      VITE_APP_URL: ${{ secrets.TEST_APP_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate isolated test Firebase
        shell: bash
        run: |
          set -euo pipefail
          required=(
            VITE_FIREBASE_API_KEY
            VITE_FIREBASE_APP_ID
            VITE_FIREBASE_AUTH_DOMAIN
            VITE_FIREBASE_PROJECT_ID
            VITE_FIREBASE_STORAGE_BUCKET
            VITE_ADMIN_EMAILS
          )

          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required test environment variable: $name"
              exit 1
            fi
          done

          if [ "$VITE_FIREBASE_PROJECT_ID" = "oitavamusicbetim" ]; then
            echo "Refusing to build test APK against production Firebase project oitavamusicbetim."
            exit 1
          fi

          echo "Test Firebase isolation validated for project: $VITE_FIREBASE_PROJECT_ID"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build Android SPA shell
        run: npm run build

      - name: Prepare packaged web assets
        shell: bash
        run: |
          set -euo pipefail
          SHELL_PATH="$(find .output dist -type f -name '_shell.html' 2>/dev/null | head -n 1 || true)"
          if [ -z "$SHELL_PATH" ]; then
            echo "TanStack SPA shell (_shell.html) was not found."
            find .output dist -maxdepth 4 -type f 2>/dev/null | sort || true
            exit 1
          fi

          STATIC_DIR="$(dirname "$SHELL_PATH")"
          echo "Using SPA output from: $STATIC_DIR"
          rm -rf android-web
          mkdir -p android-web
          cp -R "$STATIC_DIR"/. android-web/
          mv android-web/_shell.html android-web/index.html
          test -s android-web/index.html

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: oitava-music-pitch-lab-test
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
