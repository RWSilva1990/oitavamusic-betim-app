name: Patch iOS/PWA Web Push

on:
  push:
    branches:
      - fix/ios-pwa-web-push-2026-09-11

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ios-pwa-web-push-2026-09-11
          fetch-depth: 0

      - name: Apply isolated patch
        run: python scripts/patch-ios-web-push.py

      - name: Verify scope and invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(src/lib/push-client.js|src/lib/push-native.js|src/lib/push-notifications.functions.ts|src/lib/push-notifications.server.ts|src/lib/notification-center.server.ts|src/routes/api/mobile/push.ts)$' || true)"
          test -z "$unexpected"
          grep -F "platform: 'web'" src/lib/push-client.js
          grep -F "platform: 'android'" src/lib/push-native.js
          grep -F "webpush:" src/lib/notification-center.server.ts
          grep -F "android:" src/lib/notification-center.server.ts

      - name: Commit only the intended code changes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-ios-web-push.yml scripts/patch-ios-web-push.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/push-client.js src/lib/push-native.js src/lib/push-notifications.functions.ts src/lib/push-notifications.server.ts src/lib/notification-center.server.ts src/routes/api/mobile/push.ts .github/workflows/patch-ios-web-push.yml scripts/patch-ios-web-push.py
          git commit -m "fix(push): classificar web e Android sem alterar fluxo existente"
          git push origin HEAD:fix/ios-pwa-web-push-2026-09-11
