name: Patch iOS PWA Metronome Audio

on:
  push:
    branches:
      - fix/ios-pwa-metronome-audio-2026-09-12

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ios-pwa-metronome-audio-2026-09-12
          fetch-depth: 0

      - name: Apply isolated metronome audio patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/pages/Metronome.jsx')
          text = path.read_text()

          export_anchor = 'export default function MetronomePage() {'
          if text.count(export_anchor) != 1:
              raise SystemExit(f'export anchor mismatch: {text.count(export_anchor)}')
          ios_helper = """function isIOSDevice() {
            if (typeof navigator === 'undefined') return false;
            return /iPad|iPhone|iPod/.test(navigator.userAgent)
              || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
          }

          """
          ios_helper = '\n'.join(line[10:] if line.startswith('          ') else line for line in ios_helper.split('\n'))
          text = text.replace(export_anchor, ios_helper + export_anchor, 1)

          start_anchor = '  const start = useCallback(async () => {'
          end_anchor = '\n\n  useEffect(() => () => {'
          start_index = text.find(start_anchor)
          if start_index < 0:
              raise SystemExit('start anchor not found')
          end_index = text.find(end_anchor, start_index)
          if end_index < 0:
              raise SystemExit('start end anchor not found')

          new_start = """  const start = useCallback(async () => {
            if (isIOSDevice()) {
              try {
                if (navigator.audioSession && 'type' in navigator.audioSession) {
                  navigator.audioSession.type = 'playback';
                }
              } catch {}

              const existingContext = audioContextRef.current;
              if (existingContext && existingContext.state !== 'closed') {
                existingContext.close().catch(() => {});
                audioContextRef.current = null;
              }
            }

            const context = getAudioContext();
            if (!context) return;
            if (context.state === 'suspended' || context.state === 'interrupted') {
              try {
                await context.resume();
              } catch {}
            }
            if (timerRef.current) window.clearInterval(timerRef.current);
            currentBeatRef.current = 0;
            nextNoteTimeRef.current = context.currentTime + 0.05;
            runningRef.current = true;
            setRunning(true);
            setActiveBeat(0);
            scheduler();
            timerRef.current = window.setInterval(scheduler, LOOKAHEAD_MS);
          }, [getAudioContext, scheduler]);"""
          new_start = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_start.split('\n'))
          text = text[:start_index] + new_start + text[end_index:]

          path.write_text(text)
          PY

      - name: Verify strict scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "src/components/pages/Metronome.jsx"
          grep -F "navigator.audioSession.type = 'playback'" src/components/pages/Metronome.jsx
          grep -F "context.state === 'suspended' || context.state === 'interrupted'" src/components/pages/Metronome.jsx
          grep -F "const existingContext = audioContextRef.current;" src/components/pages/Metronome.jsx

      - name: Commit only metronome change
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-ios-metronome-audio.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/pages/Metronome.jsx .github/workflows/patch-ios-metronome-audio.yml
          git commit -m "fix(metronome): restaurar áudio no PWA do iOS"
          git push origin HEAD:fix/ios-pwa-metronome-audio-2026-09-12
